name: Validate Skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  package:
    name: Package validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: node --check skills/premium-frontend-director/scripts/visual-audit.mjs
      - run: node --check scripts/test-failing-fixtures.mjs

  browser-smoke:
    name: Chromium screenshot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary Playwright browser dependency
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start local test fixture
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory examples/visual-audit-fixture > /tmp/pfd-http.log 2>&1 &
          echo $! > /tmp/pfd-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pfd-http.log
          exit 1
      - name: Check four viewport screenshots and semantics
        run: node skills/premium-frontend-director/scripts/visual-audit.mjs --url http://127.0.0.1:8765 --out artifacts/visual-audit
      - name: Check deliberately failing fixtures and corrected controls
        run: node scripts/test-failing-fixtures.mjs
      - name: Upload screenshot/report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-smoke-report
          path: |
            artifacts/visual-audit/
            artifacts/failing-fixtures/
          if-no-files-found: warn
          retention-days: 14
